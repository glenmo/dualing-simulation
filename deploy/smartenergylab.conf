# Apache vhost for smartenergylab.software
# /dualing-simulation/ is reverse-proxied to a local uvicorn (127.0.0.1:8765).
# Initially HTTP-only; certbot --apache will add the :443 vhost and HTTP->HTTPS redirect.

<VirtualHost *:80>
    ServerName smartenergylab.software
    ServerAlias www.smartenergylab.software

    DocumentRoot /var/www/html

    # Required for certbot HTTP-01 challenge
    <Location /.well-known/acme-challenge/>
        ProxyPass !
    </Location>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /dualing-simulation/ http://127.0.0.1:8765/dualing-simulation/
    ProxyPassReverse /dualing-simulation/ http://127.0.0.1:8765/dualing-simulation/

    ErrorLog  ${APACHE_LOG_DIR}/smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/smartenergylab-access.log combined
</VirtualHost>
