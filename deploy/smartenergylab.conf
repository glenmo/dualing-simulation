# Apache vhost for smartenergylab.online
# /dualing-simulation/ is reverse-proxied to a local uvicorn (127.0.0.1:8765).
#
#   :80  — serves the ACME HTTP-01 challenge and 301-redirects everything else
#          to HTTPS.
#   :443 — terminates TLS (Let's Encrypt) and reverse-proxies the app.
#
# Requires: a2enmod proxy proxy_http headers ssl rewrite
# The cert paths below are created by `certbot certonly` (see install.sh); the
# :443 block will fail configtest until that cert exists.

<VirtualHost *:80>
    ServerName smartenergylab.online
    ServerAlias www.smartenergylab.online

    DocumentRoot /var/www/html

    # Let the ACME HTTP-01 challenge through unredirected (used on renewals).
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog  ${APACHE_LOG_DIR}/smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/smartenergylab-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName smartenergylab.online
    ServerAlias www.smartenergylab.online

    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/smartenergylab.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/smartenergylab.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /dualing-simulation/ http://127.0.0.1:8765/dualing-simulation/
    ProxyPassReverse /dualing-simulation/ http://127.0.0.1:8765/dualing-simulation/

    ErrorLog  ${APACHE_LOG_DIR}/smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/smartenergylab-access.log combined
</VirtualHost>
